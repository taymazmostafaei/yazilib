name: Run MTProto Proxy
on: [push]

jobs:
  run-proxy:
    runs-on: ubuntu-latest
    steps:
      - name: Start Proxy Container
        run: |
          # Example: Using a popular Docker image for MTProto
          docker run -d -p 443:443 -e SECRET=aaahaaah telegrammessenger/proxy
      
      - name: Expose Proxy (e.g., via Ngrok)
        run: |
          # You MUST use a tunnel to allow external clients to connect
          # because the GitHub runner doesn't have a public static IP
          ./ngrok tcp 443 --authtoken ${{ secrets.NGROK_TOKEN }}
          
      - name: Keep job alive
        run: sleep 6h
