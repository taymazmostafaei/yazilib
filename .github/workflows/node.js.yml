name: Test Proxy
on: workflow_dispatch

jobs:
  run-proxy:
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y mtproto-proxy cloudflared
      
      - name: Start MTProto Proxy
        run: |
          # Generate a secret
          SECRET=$(head -c 16 /dev/urandom | xxd -ps)
          echo "Secret: $SECRET"
          # Start proxy in background
          mtproto-proxy -p 8888 -S $SECRET --aes-pwd proxy-secret.conf /etc/mtproto-proxy/mtproto-proxy.conf -M 1 &
          
      - name: Start Cloudflare Tunnel
        run: |
          # Expose local port 8888 to public internet
          cloudflared tunnel --url tcp://localhost:8888
          
      - name: Keep Alive
        run: sleep 21600 # Keeps the job running for 6 hours
